name: mishka_gdi_app
description: "Sistema de Gestión de Inventario — Mishka"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP client con interceptores
  dio: ^5.7.0

  # Almacenamiento local del token JWT
  shared_preferences: ^2.3.2

  # Estado de la aplicación
  flutter_riverpod: ^2.5.1

  # Navegación declarativa
  go_router: ^14.6.2

  # Formateo de fechas y moneda
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/mishka.jpeg
