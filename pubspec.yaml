name: mishka_gdi_app
description: "Sistema de Gestión de Inventario — Mishka"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  # Delegates de localización (es_MX) para DatePicker y otros widgets Material
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Base de datos local SQLite
  sqflite: ^2.4.1
  # Utilidades de rutas del sistema de archivos
  path: ^1.9.0
  path_provider: ^2.1.5

  # Hash de passwords para login local (bcrypt)
  bcrypt: ^1.1.3

  # Estado de la aplicación
  flutter_riverpod: ^2.5.1

  # Navegación declarativa
  go_router: ^14.6.2

  # Preferencias locales (sesión "logueado", filtros, últimos valores)
  shared_preferences: ^2.3.2

  # Formateo de fechas y moneda (pin de flutter_localizations)
  intl: ^0.20.2

  # Export a Excel + compartir a Drive/Correo/USB (backup + reportes)
  excel: ^4.0.6
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/mishka.jpeg
    # Seed database (opcional). Se regenera con:
    #   python3 scripts/migrate_postgres_to_sqlite.py --pg-url "..." --output Mishka-GDI-App/assets/db/mishka_seed.db
    # Si no existe, la app crea la BD desde ddl.sql + un admin default.
    - assets/db/
    - assets/db/ddl.sql
